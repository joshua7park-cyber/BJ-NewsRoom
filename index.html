            const query = searchQuery.toLowerCase().trim();

                    item.preview.toLowerCase().includes(query) ||
                    item.insight.toLowerCase().includes(query) ||
                    item.hashtags.some(tag => tag.toLowerCase().includes(query))
                );

                if (filteredItems.length === 0) return;

                    <section class="space-y-3.5">
                        <div class="flex items-center gap-2 px-1">
                            <span class="text-xl">${section.categoryIcon}</span>
                            <h2 class="font-extrabold text-[1.1em] text-slate-900 tracking-tight">${section.categoryTitle}</h2>
                        </div>
                        <div class="space-y-3">
                `;

                    const isExpanded = expandedItems.has(item.id);
                    
                    html += `
                        <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs hover:border-slate-300 transition-all duration-200">
                            <!-- Top Info & Toggle Button -->
                            <div class="flex items-start justify-between gap-3">
                                <span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold tracking-tight">${item.badge}</span>
                                <button onclick="toggleAccordion('${item.id}')" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-colors shrink-0" aria-label="상세 보기 켜고 접기">
                                    <svg class="chevron-icon w-4 h-4 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                            </div>

                            <!-- Headline Title -->
                            <h3 onclick="toggleAccordion('${item.id}')" class="font-bold text-[1.05em] text-slate-900 leading-snug mt-2.5 cursor-pointer hover:text-blue-600 transition-colors">
                                ${item.title}
                            </h3>

                            <!-- Preview Text -->
                            <p class="text-slate-500 text-[0.92em] mt-1.5 leading-relaxed font-normal">
                                ${item.preview}
                            </p>

                            <!-- Expandable Deep Insight ('Why it matters') -->
                            <div id="acc-${item.id}" class="accordion-content ${isExpanded ? 'open' : ''}">
                                <div class="mt-4 pt-4 border-t border-slate-100 bg-blue-50/50 -mx-5 -mb-5 p-5 rounded-b-3xl">
                                    <div class="flex items-center gap-1.5 text-blue-700 font-bold text-xs uppercase tracking-wider mb-1.5">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        Why it matters (심층 인사이트)
                                    </div>
                                    <p class="text-slate-700 text-[0.95em] leading-relaxed font-medium">
                                        ${item.insight}
                                    </p>
                                </div>
                            </div>

                            <!-- Hashtag Chips -->
                            <div class="flex flex-wrap gap-1.5 mt-3.5 pt-3 border-t border-slate-100/60">
                                ${item.hashtags.map(tag => `<span class="text-xs font-semibold text-blue-600 bg-blue-50/80 px-2.5 py-1 rounded-lg">${tag}</span>`).join('')}
                            </div>
                        </div>
                    `;
                });

                html += `</div></section>`;
            });

            if (html === "") {
                html = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8">
                        <div class="text-4xl mb-3">🔍</div>
                        <h3 class="font-bold text-slate-800 text-lg">검색 결과가 없습니다</h3>
                        <p class="text-slate-500 text-sm mt-1">다른 키워드로 검색해 보세요.</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // 아코디언 토글 제어
        function toggleAccordion(id) {
            if (expandedItems.has(id)) {
                expandedItems.delete(id);
            } else {
                expandedItems.add(id);
            }
            renderApp();
        }

        // 폰트 사이즈 조절
        function adjustFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 13) currentFontSize = 13;
            if (currentFontSize > 22) currentFontSize = 22;
            
            document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
            document.getElementById('fontSizeDisplay').innerText = currentFontSize;
        }

        // 폰트 패밀리 변경
        function changeFontFamily(font) {
            let familyValue = "";
            switch(font) {
                case 'Pretendard':
                    familyValue = "'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif";
                    break;
                case 'System':
                    familyValue = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
                    break;
                case 'Nanum Gothic':
                    familyValue = "'Nanum Gothic', sans-serif";
                    break;
                case 'Noto Serif KR':
                    familyValue = "'Noto Serif KR', serif";
                    break;
            }
            document.documentElement.style.setProperty('--font-family', familyValue);
        }

        // 실시간 검색 핸들러
        function handleSearch(val) {
            searchQuery = val;
            renderApp();
        }

        // 초기 실행
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
