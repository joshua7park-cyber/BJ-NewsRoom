        const RELIGION_EVENTS_HTML = "<article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">상시 참고자료</div><h3 class=\"font-bold text-slate-900 leading-snug\">비교종교 · 세계 종교 동향</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">기독교·이슬람·불교·힌두교 등 종교 간 관계와 비교종교 연구 자료를 살펴보는 자료 안내입니다. 특정 날짜의 행사나 모집 공고가 아닙니다.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://www.pewresearch.org/religion/\" rel=\"noopener noreferrer\" target=\"_blank\">공식 자료 보기 ↗</a></article><article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">행사별 일정·모집 확인</div><h3 class=\"font-bold text-slate-900 leading-snug\">선교적 교회 · 세계선교 세미나</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">한국세계선교협회(KWMA)의 공지사항과 사역 안내에서 선교 지도자 포럼, 북클럽, 선교 콜로퀴움 등 새 소식을 확인할 수 있습니다.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://kwma.org/\" rel=\"noopener noreferrer\" target=\"_blank\">KWMA 공식 공지 확인 ↗</a></article><article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">교육 일정 별도 확인</div><h3 class=\"font-bold text-slate-900 leading-snug\">다문화 · 디아스포라 선교</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">국내 다문화·이주민·난민 관련 선교 교육 및 사례 발표회는 주최 기관의 새 공지를 통해 확인하세요. 확인되지 않은 교육 날짜는 표시하지 않았습니다.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://kwma.org/\" rel=\"noopener noreferrer\" target=\"_blank\">KWMA 교육·사역 안내 ↗</a></article><article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">새 강좌 개설 여부 확인</div><h3 class=\"font-bold text-slate-900 leading-snug\">무슬림 전도 · 이슬람 이해 교육</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">무슬림 이웃 이해, 신앙 대화와 제자양육 관련 훈련 안내입니다. 과거 교육과정을 현재 모집 중인 것으로 표시하지 않습니다.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://www.ttgu.ac.kr/\" rel=\"noopener noreferrer\" target=\"_blank\">관련 교육기관 안내 ↗</a></article>";
        const SCIENCE_EVENTS_HTML = "<article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">일정 확인 · 등록 여부 확인</div><h3 class=\"font-bold text-slate-900 leading-snug\">AI EXPO KOREA 2027 · 국제인공지능대전</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">2027년 4월 14~16일 · 서울 코엑스 Hall A. AI 솔루션, 인프라, 산업 융합 분야 전시입니다. 등록 조건은 공식 사이트를 확인하세요.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://aiexpo.co.kr/전시회-개요/\" rel=\"noopener noreferrer\" target=\"_blank\">공식 전시회 안내 ↗</a></article><article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">예정 · 티켓 추후 오픈</div><h3 class=\"font-bold text-slate-900 leading-snug\">AI Summit Seoul &amp; EXPO 2027</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">2027년 8월 11~13일 · 코엑스 그랜드볼룸 및 전시장 B홀. 전시 티켓은 공식 안내상 2027년 4월 공개 예정입니다.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://www.aisummit.co.kr/expo-visitor-2027\" rel=\"noopener noreferrer\" target=\"_blank\">공식 관람 안내 ↗</a></article><article class=\"bg-white rounded-3xl p-5 border border-slate-200 shadow-xs\"><div class=\"text-xs font-semibold text-blue-700 mb-2\">일정 확인 · 신청 조건 확인</div><h3 class=\"font-bold text-slate-900 leading-snug\">한국인공지능학회 2026 추계학술대회</h3><p class=\"text-slate-600 text-[0.92em] leading-relaxed mt-2\">2026년 11월 19~20일 · 서울대학교 호암교수회관 베리타스홀. 논문 모집·참가 조건은 학회 공식 공지를 확인하세요.</p><a class=\"inline-flex mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500\" href=\"https://aiassociation.kr/index.asp\" rel=\"noopener noreferrer\" target=\"_blank\">학회 공식 공지 ↗</a></article>";

        // 앱 상태 변수
        let currentFontSize = 16;
        let searchQuery = "";
        let expandedItems = new Set();

        // 렌더링 함수
        function renderApp() {
            const container = document.getElementById('newsFeedContainer');
            const query = searchQuery.toLowerCase().trim();
            
            let html = "";

            newsDatabase.forEach(section => {
                // 검색어 필터링
                const filteredItems = section.items.filter(item => 
                    item.title.toLowerCase().includes(query) || 
                    item.preview.toLowerCase().includes(query) ||
                    item.insight.toLowerCase().includes(query) ||
                    item.hashtags.some(tag => tag.toLowerCase().includes(query))
                );

                const hasEventMatch = (section.categoryTitle === "Religion / 종교" && RELIGION_EVENTS_HTML.toLowerCase().includes(query)) || (section.categoryTitle === "Science & Technics" && SCIENCE_EVENTS_HTML.toLowerCase().includes(query));
                if (filteredItems.length === 0 && !hasEventMatch) return;

                html += `
                    <section class="space-y-3.5">
                        <div class="flex items-center gap-2 px-1">
                            <span class="text-xl">${section.categoryIcon}</span>
                            <h2 class="font-extrabold text-[1.1em] text-slate-900 tracking-tight">${section.categoryTitle}</h2>
                        </div>
                        <div class="space-y-3">
                `;

                filteredItems.forEach(item => {
                    const isExpanded = expandedItems.has(item.id);
                    
                    html += `
                        <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-xs hover:border-slate-300 transition-all duration-200">
                            <!-- Top Info & Toggle Button -->
                            <div class="flex items-start justify-between gap-3">
                                <span class="px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg text-xs font-bold tracking-tight">${item.badge}</span>
                                <button onclick="toggleAccordion('${item.id}')" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition-colors shrink-0" aria-label="상세 보기 켜고 접기">
                                    <svg class="chevron-icon w-4 h-4 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                                </button>
                            </div>

                            <!-- Headline Title -->
                            <h3 onclick="toggleAccordion('${item.id}')" class="font-bold text-[1.05em] text-slate-900 leading-snug mt-2.5 cursor-pointer hover:text-blue-600 transition-colors">
                                ${item.title}
                            </h3>

                            <!-- Preview Text -->
                            <p class="text-slate-500 text-[0.92em] mt-1.5 leading-relaxed font-normal">
                                ${item.preview}
                            </p>

                            <!-- Expandable Deep Insight ('Why it matters') -->
                            <div id="acc-${item.id}" class="accordion-content ${isExpanded ? 'open' : ''}">
                                <div class="mt-4 pt-4 border-t border-slate-100 bg-blue-50/50 -mx-5 -mb-5 p-5 rounded-b-3xl">
                                    <div class="flex items-center gap-1.5 text-blue-700 font-bold text-xs uppercase tracking-wider mb-1.5">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                        Why it matters (심층 인사이트)
                                    </div>
                                    <p class="text-slate-700 text-[0.95em] leading-relaxed font-medium">
                                        ${item.insight}
                                    </p>
                                </div>
                            </div>

                            <!-- Hashtag Chips -->
                            <div class="flex flex-wrap gap-1.5 mt-3.5 pt-3 border-t border-slate-100/60">
                                ${item.hashtags.map(tag => `<span class="text-xs font-semibold text-blue-600 bg-blue-50/80 px-2.5 py-1 rounded-lg">${tag}</span>`).join('')}
                            </div>
                        </div>
                    `;
                });

                // 관련 교육·행사는 해당 뉴스 분야의 기사 바로 아래에 배치합니다.
                if (section.categoryTitle === "Religion / 종교" || section.categoryTitle === "Science & Technics") {
                    const eventsHtml = section.categoryTitle === "Religion / 종교" ? RELIGION_EVENTS_HTML : SCIENCE_EVENTS_HTML;
                    // 기사 필터 검색 시 행사 키워드도 함께 검색할 수 있게 별도 처리를 합니다.
                    if (!query || eventsHtml.toLowerCase().includes(query)) {
                        html += `<details class="mt-5 pt-4 border-t border-slate-200 group"><summary class="cursor-pointer list-none flex items-center justify-between gap-3 p-4 bg-blue-50 rounded-2xl hover:bg-blue-100"><span class="font-extrabold text-[1em] text-blue-900">📅 관련 교육 · 세미나 · 행사 <span class="text-xs font-normal text-blue-700">(눌러서 보기)</span></span><span class="text-blue-700 text-lg group-open:rotate-180 transition-transform">⌄</span></summary><div class="space-y-3 mt-3"><p class="text-xs text-slate-500 px-1">주최기관의 공식 안내에서 일정과 신청 가능 여부를 확인하세요.</p>${eventsHtml}</div></details>`;
                    }
                }
                html += `</div></section>`;
            });

            if (html === "") {
                html = `
                    <div class="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8">
                        <div class="text-4xl mb-3">🔍</div>
                        <h3 class="font-bold text-slate-800 text-lg">검색 결과가 없습니다</h3>
                        <p class="text-slate-500 text-sm mt-1">다른 키워드로 검색해 보세요.</p>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        // 아코디언 토글 제어
        function toggleAccordion(id) {
            if (expandedItems.has(id)) {
                expandedItems.delete(id);
            } else {
                expandedItems.add(id);
            }
            renderApp();
        }

        // 폰트 사이즈 조절
        function adjustFontSize(delta) {
            currentFontSize += delta;
            if (currentFontSize < 13) currentFontSize = 13;
            if (currentFontSize > 22) currentFontSize = 22;
            
            document.documentElement.style.setProperty('--base-font-size', `${currentFontSize}px`);
            document.getElementById('fontSizeDisplay').innerText = currentFontSize;
        }

        // 폰트 패밀리 변경
        function changeFontFamily(font) {
            let familyValue = "";
            switch(font) {
                case 'Pretendard':
                    familyValue = "'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif";
                    break;
                case 'System':
                    familyValue = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
                    break;
                case 'Nanum Gothic':
                    familyValue = "'Nanum Gothic', sans-serif";
                    break;
                case 'Noto Serif KR':
                    familyValue = "'Noto Serif KR', serif";
                    break;
            }
            document.documentElement.style.setProperty('--font-family', familyValue);
        }

        // 실시간 검색 핸들러
        function handleSearch(val) {
            searchQuery = val;
            renderApp();
        }

        // 초기 실행
        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });

        async function loadBJLiveNews() {
          const status = document.getElementById('bj-live-status');
          const list = document.getElementById('bj-live-list');
          if (!status || !list) return;
          try {
            const res = await fetch('./site/newsroom.json?updated=' + Math.floor(Date.now()/300000), {cache:'no-store'});
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const payload = await res.json();
            if (payload.schema_version !== 2 || !Array.isArray(payload.news)) throw new Error('데이터 형식 오류');
            const domestic = payload.news.filter(x => x.section === 'domestic' && /^https:\/\//.test(x.url || '') && x.source);
            const other = payload.news.filter(x => x.section !== 'domestic' && /^https:\/\//.test(x.url || '') && x.source);
            const selected = [...domestic.slice(0,8), ...other.slice(0,4)];
            list.replaceChildren();
            for (const article of selected) {
              const a = document.createElement('a');
              a.href = article.url;
              a.target = '_blank'; a.rel = 'noopener noreferrer';
              a.className = 'block border border-slate-200 p-3 rounded-2xl hover:border-blue-400 hover:bg-blue-50 transition-colors';
              const source = document.createElement('p');
              source.className = 'text-xs text-blue-700 font-bold mb-1';
              source.textContent = (article.section === 'domestic' ? '국내 · ' : '국제/전문 · ') + article.source;
              const heading = document.createElement('h3');
              heading.className = 'text-sm font-bold text-slate-900 leading-snug';
              heading.textContent = article.title;
              const note = document.createElement('p');
              note.className = 'text-xs text-slate-500 mt-2';
              note.textContent = '자동 수집 · 원문 미검증' + (new URL(article.url).hostname === 'news.google.com' ? ' · Google News 경유' : '');
              a.append(source,heading,note);
              list.append(a);
            }
            status.textContent = selected.length ? '기사 ' + selected.length + '건 · ' + new Date(payload.built_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}) + ' 기준' : '현재 표시할 기사 없음';
          } catch(e) {
            status.textContent = '최신 데이터 연결 실패 · 이전 편집 화면 유지';
            list.replaceChildren();
          }
        }
        document.addEventListener('DOMContentLoaded',loadBJLiveNews);
    </script>
</body>
</html>
