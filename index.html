<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="중요한 뉴스 다섯 건만 먼저 읽는 BJ Intelligence Newsroom">
<title>BJ Newsroom · 오늘의 하이라이트</title>
<style>
:root{--ink:#1a2c45;--sub:#74849b;--blue:#255fc5;--line:#e3eaf3;--font:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--scale:1}
*{box-sizing:border-box}
body{margin:0;background:#f9fbfe;color:var(--ink);font-family:var(--font);font-size:calc(16px * var(--scale));-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #e9ab4e;outline-offset:3px}
.wrap{max-width:940px;padding:0 24px;margin:auto}
.top{background:#fff;border-bottom:1px solid #e8eef6}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:74px}
.logo{font-size:1.25em;font-weight:900;letter-spacing:-.06em;white-space:nowrap}
.logo b{color:var(--blue)}
.logo small{display:block;font-size:.51em;color:#91a0b5;font-weight:680;letter-spacing:.135em;margin-top:5px}
.tools{display:flex;justify-content:flex-end;gap:7px;align-items:center}
.search{min-width:0;width:184px;background:#f7faff;border:1px solid #dfe8f3;color:var(--ink);padding:10px 12px;border-radius:11px;font-size:.76em}
.font,.btn{border:1px solid #dfe8f3;background:#fff;color:#51647c;border-radius:10px;padding:9px 10px;font-size:.75em}
.btn{min-width:35px;font-weight:830}
.font:hover,.btn:hover{background:#f1f6ff}
.nav{background:white;border-bottom:1px solid #eff2f7}
.nav .wrap{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;padding-top:9px;padding-bottom:10px}
.nav .wrap::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;border-radius:10px;padding:10px 12px;color:#738197;white-space:nowrap;font-size:.82em;font-weight:750}
.nav button[aria-pressed="true"]{background:#eaf2ff;color:#235bbc}
main.wrap{padding-top:31px;padding-bottom:42px}
.kicker{font-size:.7em;color:#3466b9;font-weight:900;letter-spacing:.11em}
h1{font-size:clamp(1.65em,3.9vw,2.18em);font-weight:870;letter-spacing:-.055em;line-height:1.24;margin:8px 0 9px}
.meta-top{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap;align-items:center;margin:0 0 21px}
.meta-top p{margin:0;color:#7c8ba0;font-size:.81em;line-height:1.5}
.edition{color:#8999ae;font-size:.72em}
.stories{display:grid;gap:11px}
.story{border:1px solid var(--line);border-radius:16px;background:white;box-shadow:0 5px 19px #19345306;overflow:hidden}
.story.lead{background:linear-gradient(108deg,#ebf4ff,#fff 84%);border-color:#d6e5f8}
.story>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:35px minmax(0,1fr) 25px;gap:14px;align-items:center;padding:19px 21px}
.story>summary::-webkit-details-marker{display:none}
.rank{width:34px;height:34px;border-radius:11px;background:#edf3fb;color:#557294;display:grid;place-items:center;font-size:.74em;font-weight:860}
.lead .rank{background:var(--blue);color:#fff}
.category{font-size:.7em;font-weight:820;color:#3770c6;margin-bottom:5px}
.story h2{font-size:1.03em;letter-spacing:-.033em;line-height:1.43;margin:0;font-weight:820}
.sub{margin:6px 0 0;color:#8190a4;font-size:.78em;line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden}
.story[open] .sub{-webkit-line-clamp:2}
.chevron{width:25px;height:25px;background:#f0f5fb;color:#6d819c;border-radius:100%;display:grid;place-items:center;transition:transform .14s}
.story[open] .chevron{transform:rotate(180deg);background:#e9f1ff;color:#275dc1}
.reader{border-top:1px solid #e8edf5;margin:0 21px;padding:19px 1px 23px}
.reader h3{font-size:.81em;color:#345e9b;margin:18px 0 6px}.reader h3:first-child{margin-top:0}
.reader p{color:#344d69;font-size:.9em;line-height:1.84;margin:0}
.sources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sources a{background:#edf4ff;padding:7px 10px;border-radius:8px;font-size:.73em;font-weight:760}
.evidence{color:#7c8a9d!important;border-top:1px solid #edf2f8;margin-top:16px!important;padding-top:11px;font-size:.74em!important}
.fold{border:1px solid var(--line);border-radius:15px;background:#fff;margin-top:21px;overflow:hidden}
.fold>summary{list-style:none;cursor:pointer;padding:18px 19px;font-size:.86em;font-weight:800;display:flex;justify-content:space-between;gap:9px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary small{font-size:.8em;color:#8a9bb0;font-weight:500}
.event-inner{padding:0 19px 8px;border-top:1px solid #edf2f7}
.event{padding:13px 0;border-bottom:1px solid #eef2f6}.event:last-child{border:0}
.event-date{font-size:.72em;color:#2864c5;font-weight:840}
.event-title{font-size:.87em;font-weight:780;line-height:1.46;margin:4px 0}
.event-sub{font-size:.73em;color:#8190a4;line-height:1.58;margin:0}
.event a{display:inline-block;margin-top:6px;font-size:.74em;font-weight:750}
.empty{padding:24px;border:1px dashed #d9e3ef;border-radius:14px;color:#71839b;background:#fff;font-size:.86em;line-height:1.7}
.note{font-size:.73em;line-height:1.7;color:#93a0b1;margin:18px 0 0}
footer{border-top:1px solid #edf1f7;color:#97a3b3;font-size:.7em;line-height:1.7;padding:16px 0 30px}
@media(max-width:650px){
.wrap{padding:0 16px}.top .wrap{align-items:flex-start;flex-direction:column;gap:11px;padding-top:15px;padding-bottom:13px}
.tools{justify-content:flex-start;flex-wrap:wrap;width:100%}.search{flex:1;width:auto;min-width:132px}
.nav .wrap{padding-top:7px;padding-bottom:7px}.nav button{padding:9px 10px}
main.wrap{padding-top:25px}.story>summary{grid-template-columns:30px minmax(0,1fr) 24px;gap:10px;padding:16px 13px}
.rank{width:30px;height:30px}.story h2{font-size:.98em}.reader{margin:0 15px}h1{font-size:1.81em}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<div class="logo"><b>BJ</b> Newsroom<small>INTELLIGENCE · ESSENTIAL FIRST</small></div>
<div class="tools">
<input class="search" id="search" type="search" placeholder="⌕ 뉴스 검색" aria-label="핵심 기사 검색">
<select class="font" id="font" aria-label="글꼴 선택"><option value="system">기본</option><option value="gothic">고딕</option><option value="serif">명조</option></select>
<button class="btn" id="minus" aria-label="글자 작게">A−</button><button class="btn" id="plus" aria-label="글자 크게">A+</button>
</div></div></header>
<nav class="nav" aria-label="뉴스 분야"><div class="wrap" id="tabs"></div></nav>
<main class="wrap">
<div class="kicker">TODAY'S ESSENTIALS</div>
<h1 id="heading">오늘의 하이라이트</h1>
<div class="meta-top"><p id="subtitle">꼭 필요한 5건만. 눌러서 바로 읽으세요.</p><span class="edition" id="edition">편집 자료 연결 중</span></div>
<div class="stories" id="stories" aria-live="polite"><div class="empty">뉴스 불러오는 중…</div></div>
<details class="fold" id="events"><summary>다가오는 교육·세미나 <small>선교·목회 / 과학·AI</small></summary><div class="event-inner" id="eventList"></div></details>
<p class="note">선별된 핵심 기사는 편집 중요도순입니다. 조회수 순위가 아니며, 취재 사실과 검증 범위를 구분해 제공합니다.</p>
</main>
<footer><div class="wrap">BJ Intelligence Newsroom · 기사 전문을 복제하지 않고 확인 가능한 근거로 직접 요약합니다.</div></footer>
<script>
const tabs=[['all','Home'],['경제·금융','경제'],['정치·사회','정치·사회'],['테크·산업','테크·산업'],['국제','국제'],['이스라엘','이스라엘'],['Religion','Religion'],['과학','과학'],['AI 교육','AI 교육']];
const $=id=>document.getElementById(id);
let data=null,tab='all',query='',font='system',zoom=1,sourceMode='archive';
const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n};
const validUrl=v=>{try{const x=new URL(v);return x.protocol==='https:'?x.href:null}catch{return null}};
function match(s){return (tab==='all'||(s.topics||[]).includes(tab))&&(!query||[s.title,s.dek,s.core,s.section,s.why,...(s.topics||[])].join(' ').toLowerCase().includes(query))}
function eventMatch(e){return tab==='all'||(tab==='Religion'&&e.section==='Religion')||(['과학','테크·산업','AI 교육'].includes(tab)&&e.section==='과학·AI')}
function nav(){const box=$('tabs');box.replaceChildren();tabs.forEach(([id,name],i)=>{const b=make('button','',name);b.type='button';b.setAttribute('aria-pressed',String(tab===id));b.onclick=()=>{tab=id;render()};box.append(b)})}
function story(x,i){
 const d=make('details',i===0?'story lead':'story'),s=make('summary');
 const rank=make('span','rank',String(i+1).padStart(2,'0'));
 const main=make('div');const category=make('div','category',x.section+' · '+(x.date_label||'기사')+(sourceMode==='live'?' · RSS 확인':' · 편집판'));
 const h=make('h2','',x.title),p=make('p','sub',x.dek);
 main.append(category,h,p);s.append(rank,main,make('span','chevron','⌄'));d.append(s);
 const reader=make('div','reader');
 [['핵심 내용',x.core],['왜 중요한가',x.why],['배경과 맥락',x.background]].forEach(([heading,text])=>{
 const block=make('h3','',heading),para=make('p','',text);reader.append(block,para)
 });
 const links=make('div','sources');(x.sources||[]).forEach(src=>{const url=validUrl(src.url);if(!url)return;const a=make('a','',src.name+' · 참고 출처');a.href=url;a.target='_blank';a.rel='noopener noreferrer';links.append(a)});reader.append(links);
 reader.append(make('p','evidence','확인 범위 · '+(x.verification||'추가 확인 필요')));
 d.append(reader);return d;
}
function renderEvents(){
 const host=$('eventList'),fold=$('events');host.replaceChildren();
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=k=>parts.find(p=>p.type===k).value;const now=get('year')+'-'+get('month')+'-'+get('day');
 const ev=(data?.events||[]).filter(e=>eventMatch(e)&&(e.end||e.start)>=now&&(!query||[e.title,e.host,e.section].join(' ').toLowerCase().includes(query))).slice(0,4);
 fold.hidden=ev.length===0;if(!ev.length)return;
 ev.forEach(e=>{const wrap=make('article','event');wrap.append(make('div','event-date',e.start+' · '+(e.time_label||'')),make('div','event-title',e.title),make('p','event-sub',e.host+' · '+(e.place||'')));const url=validUrl(e.apply_url);if(url){const a=make('a','','공식 안내·신청 ↗');a.href=url;a.target='_blank';a.rel='noopener noreferrer';wrap.append(a)}host.append(wrap)});
}
function render(){
 nav();const list=$('stories');list.replaceChildren();
 const kstToday=(()=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const g=k=>p.find(x=>x.type===k).value;return g('year')+'-'+g('month')+'-'+g('day')})();const isFresh=data?.edition_date===kstToday;
 $('heading').textContent=tab==='all'?(isFresh?'오늘의 하이라이트':'최근 확인된 하이라이트'):(tabs.find(x=>x[0]===tab)?.[1]||tab)+' · 핵심 뉴스';
 $('subtitle').textContent='먼저 최대 5건만. 제목을 누르면 바로 읽을 수 있습니다.';
 if(!data){list.append(make('div','empty','편집 뉴스 불러오는 중…'));$('events').hidden=true;return}
 let rows=[...data.stories].filter(match).sort((a,b)=>a.priority-b.priority).slice(0,5);
 if(!rows.length)list.append(make('div','empty','현재 이 분야에서 확인된 주요 뉴스가 없습니다.'));
 else rows.forEach((x,i)=>list.append(story(x,i)));
 $('edition').textContent=(data.edition_label||data.edition_date)+(sourceMode==='live'?' · RSS 자동 선별(본문 독립 검증 전)':(isFresh?' · 검토된 편집판':' · 지난 편집판'));
 $('subtitle').textContent=sourceMode==='live'?'공개 RSS의 제목·짧은 설명만 확인한 최신 소식입니다. 상세 내용을 확인한 심층 분석은 아닙니다.':'먼저 최대 5건만. 제목을 누르면 바로 읽을 수 있습니다.';
 renderEvents();
}
function settings(){const fonts={system:"system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif",gothic:"'Nanum Gothic','Malgun Gothic',sans-serif",serif:"'Noto Serif KR','Batang',serif"};document.documentElement.style.setProperty('--font',fonts[font]);document.documentElement.style.setProperty('--scale',String(zoom));$('font').value=font}
$('search').oninput=e=>{query=e.target.value.toLowerCase().trim();render()};
$('font').onchange=e=>{font=e.target.value;settings()};
$('minus').onclick=()=>{zoom=Math.max(.85,Math.round((zoom-.05)*100)/100);settings()};
$('plus').onclick=()=>{zoom=Math.min(1.35,Math.round((zoom+.05)*100)/100);settings()};
async function load(){
 const get=async path=>{const r=await fetch(path+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
 try{
  const result=await Promise.allSettled([get('./site/live-edition.json'),get('./data/edition.json')]);
  const live=result[0].status==='fulfilled'?result[0].value:null;
  const archive=result[1].status==='fulfilled'?result[1].value:null;
  const liveAge=live?.built_at?(Date.now()-Date.parse(live.built_at))/3600000:Infinity;
  const recent=live&&live.schema_version===1&&live.kind==='rss_sourced_auto_digest'&&Array.isArray(live.stories)&&live.stories.length>=5&&liveAge>=-1&&liveAge<=30;
  if(recent){data={...live,events:Array.isArray(archive?.events)?archive.events:[]};sourceMode='live'}
  else if(archive&&archive.schema_version===1&&Array.isArray(archive.stories)){data=archive;sourceMode='archive'}
  else throw Error('발행된 뉴스 데이터를 읽을 수 없습니다');
  render();
 }catch(err){
  $('stories').replaceChildren(make('div','empty','뉴스를 불러오지 못했습니다. 마지막 검증판도 읽지 못했습니다.'));
  $('edition').textContent='연결 확인 필요';$('events').hidden=true;
 }
}
settings();render();load();
</script>
</body></html>
