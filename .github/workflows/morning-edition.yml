name: BJ Morning 07:30 RSS edition
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bj-morning-edition
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare fresh news and morning index
        run: |
          python scripts/update_feed.py
          python scripts/build_morning_index.py
      - name: Validate freshness and provenance
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone,timedelta
          d=json.load(open('morning-index.json'))
          assert d['is_chatgpt_editorial'] is False
          assert d['items']
          today=datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          assert d['date_kst']==today
          print('Morning edition',today,len(d['items']))
          PY
      - name: Publish prepared data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/newsroom.json morning-index.json
          if git diff --cached --quiet; then echo 'Unchanged'; exit 0; fi
          git commit -m 'data: morning RSS edition'
          git push
