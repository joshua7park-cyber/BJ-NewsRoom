name: BJ Newsroom Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['BJ Newsroom - hourly feed refresh', 'BJ Morning 07:30 RSS edition']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate HTML JavaScript syntax and news JSON
        run: |
          python - <<'PY'
          import re, json, pathlib
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          assert scripts, 'No inline JavaScript'
          pathlib.Path('/tmp/newsroom-app.js').write_text(chr(10).join(scripts),encoding='utf-8')
          d=json.loads(pathlib.Path('site/newsroom.json').read_text(encoding='utf-8'))
          assert d.get('schema_version')==2 and isinstance(d.get('news'),list)
          PY
          node --check /tmp/newsroom-app.js

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test public Pages after deployment
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          url=os.environ['PUBLIC_URL'].rstrip('/')+'/'
          for path, needle in [('', b'BJ INTELLIGENCE'), ('site/newsroom.json', b'"schema_version"')]:
           for attempt in range(6):
            try:
             with urllib.request.urlopen(url+path, timeout=15) as r: body=r.read()
             assert len(body)>500 and needle in body
             print('PUBLIC PASS',url+path, len(body))
             break
            except Exception as e:
             if attempt==5: raise
             time.sleep(10)
          PY
