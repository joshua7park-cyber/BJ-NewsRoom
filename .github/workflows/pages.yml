name: BJ Newsroom Deploy
# Gate → deploy → public check. Nothing reaches the public page unless every gate passes.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 22 * * *'   # 07:41 KST: re-check links and the public page after the 07:30 edition
  workflow_run:
    workflows: ['BJ Newsroom - hourly feed refresh']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5

      - name: 1. Edition data gate (schema, grades, weekdays, dummy text)
        run: python scripts/validate_edition.py

      - name: 2. Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: 3. Page JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          js = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert js, 'index.html에 스크립트가 없습니다'
          pathlib.Path('/tmp/app.js').write_text('\n'.join(js), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: 3b. Chromium browser smoke tests
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py

      - name: 4. Source and sign-up links
        run: python scripts/check_links.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 5. Public page check
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base = os.environ['PUBLIC_URL'].rstrip('/') + '/'
          want = json.load(open('data/edition.json', encoding='utf-8'))['edition_date']
          checks = [('', '오늘의 하이라이트'), ('data/edition.json', want),
                    ('site/link-report.json', want), ('site/newsroom.json', 'schema_version')]
          for path, needle in checks:
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(f'{base}{path}?v={time.time()}', timeout=20) as r:
                          body = r.read().decode('utf-8')
                      assert needle in body, f'{needle!r} not in {path or "index.html"}'
                      print('PUBLIC PASS', base + path)
                      break
                  except Exception as ex:
                      if attempt == 7:
                          raise SystemExit(f'PUBLIC FAIL {base}{path}: {ex}')
                      time.sleep(15)
          PY
