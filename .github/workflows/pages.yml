name: BJ Newsroom Deploy
# Gate → deploy → public check. Nothing reaches the public page unless every gate passes.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '41 22 * * *'   # 07:41 KST: re-check links and the public page after the 07:30 edition
  workflow_run:
    workflows: ['BJ Newsroom - hourly feed refresh']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5

      - name: 1. Edition data gate (schema, grades, weekdays, dummy text)
        run: python scripts/validate_edition.py

      - name: 2. Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: 3. Page JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          js = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert js, 'index.html에 스크립트가 없습니다'
          pathlib.Path('/tmp/app.js').write_text('\n'.join(js), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: 3b. Chromium browser smoke tests
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/browser_smoke.py

      - name: 4. Source and sign-up links
        run: python scripts/check_links.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 5. Real public Chromium regression
        env:
          BJ_TEST_URL: ${{ steps.deployment.outputs.page_url }}
        run: python tests/browser_smoke.py

      - name: 6. Audited public website and editorial data
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          BROWSER_CHECK: passed
        run: python scripts/audit_public.py

      - name: Preserve failure evidence when a validation or deployment step fails
        if: failure()
        env:
          JOB_RESULT: failed
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          p=Path('site/deployment-status.json')
          try: d=json.loads(p.read_text(encoding='utf8'))
          except Exception: d={}
          if d.get('run_id')!=os.getenv('GITHUB_RUN_ID') or d.get('latest_run_status')!='success':
              d.update(schema_version=1,latest_run_status='failed',
                  observed_at_utc=datetime.now(timezone.utc).isoformat(),
                  run_id=os.getenv('GITHUB_RUN_ID'),revision=os.getenv('GITHUB_SHA'),
                  note='GitHub Actions workflow failed. Examine the failed job step logs.',
                  site_url='https://joshua7park-cyber.github.io/BJ-NewsRoom/')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\\n',encoding='utf8')
          PY

      - name: Upload public verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-verification-${{ github.run_id }}
          path: site/deployment-status.json
          if-no-files-found: warn
